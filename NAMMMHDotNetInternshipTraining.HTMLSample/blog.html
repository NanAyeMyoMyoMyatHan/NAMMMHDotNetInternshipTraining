<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>

<body>
    <div class="container-fluid">
        <!-- Blog Title Input -->
        <div class="mb-3">
            <label for="blogTitle" class="form-label">Blog Title</label>
            <input type="text" class="form-control" id="blogTitle" placeholder="Enter a catchy title...">
        </div>

        <!-- Blog Author Input -->
        <div class="mb-3">
            <label for="blogAuthor" class="form-label">Author Name</label>
            <input type="text" class="form-control" id="blogAuthor" placeholder="Your name or alias...">
        </div>

        <!-- Blog Content Textarea -->
        <div class="mb-3">
            <label for="blogContent" class="form-label">Blog Content</label>
            <textarea class="form-control" id="blogContent" rows="6" placeholder="Write your story here..."></textarea>
        </div>
    </div>
    <button type="button" class="btn btn-secondary">Cancle</button>
    <button type="button" class="btn btn-success" id="btnsave">Save</button>

    <table class="table">
        <thead>
            <tr>
                <th scope="col">Action</th>
                <th scope="col">Noumber</th>
                <th scope="col">Title</th>
                <th scope="col">Author</th>
                <th scope="col">Content</th>
            </tr>
        </thead>
        <tbody id="tblBlogs">
            <tr>
                <th scope="row">1</th>
                <td>Mark</td>
                <td>Otto</td>
                <td>@mdo</td>
            </tr>
            <tr>
                <th scope="row">1</th>
                <td>Mark</td>
                <td>Otto</td>
                <td>@mdo</td>
            </tr>

        </tbody>
    </table>

    <script src="js/jquery-4.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        let editingBlogId = null;
        $(document).ready(function () { // window load တာနဲ့ပေါ်မယ်
            // alert("Helloworld");
            loadBlogs();
        })
        $('#btnsave').click(function () {
            if(editingBlogId == null){
                saveBlog();
            }
            else{
                updateBlog();
            }
            })
            function saveBlog(){
            let title = $('#blogTitle').val();
            let authorname = $('#blogAuthor').val();
            let content = $('#blogContent').val();
            console.log(title);
            console.log(authorname);
            console.log(content);

            let blogs = [];
            const existingBlogs = localStorage.getItem('blogs');
            if (existingBlogs !=null) {
                blogs = JSON.parse(existingBlogs);
            }
            // localStorage.setItem("title",title);
            // localStorage.setItem("AuthorName",authorname);
            // localStorage.setItem("Content",content);

            const blog = {
                id: crypto.randomUUID(),
                title: title,
                authorName: authorname,
                content: content
            }
            blogs.push(blog);
            localStorage.setItem('blogs', JSON.stringify(blogs));
            loadBlogs();
            // localStorage.setItem('blog',JSON.stringify(blog));

        }
        function updateBlog(){
            let title =$('#blogTitle').val();
            let author =$('#blogAuthor').val();
            let content=$('#blogContent').val();

            let blogs = [];
            const existingBlogs = localStorage.getItem('blogs');
            if(existingBlogs != null){
                blogs = JSON.parse(existingBlogs);
            }
            let blogIndex = blogs.findIndex(b=>b.id===editingBlogId);
            if(blogIndex === -1){
                alert("Blog not found");
                return ;
            }
            blogs[blogIndex].title=title;
            blogs[blogIndex].authorName=author;
            blogs[blogIndex].console=content;
            localStorage.setItem('blogs',JSON.stringify(blogs));
            loadBlogs();
        }
        function loadBlogs() {
            let blogs = [];
            const existingBlogs = localStorage.getItem('blogs');
            if (existingBlogs != null) {
                blogs = JSON.parse(existingBlogs);
            }
            console.log({ blogs });
            $('#tblBlogs').html('');
            for (let i = 0; i < blogs.length; i++) {
                const blogItem = blogs[i];
                const html = `<tr>
                    <td>
                        <button class="btn btn-sm btn-primary" onclick="editBlog('${blogItem.id}')">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteBlog('${blogItem.id}')">Delete</button>
                    </td>
      <th scope="row">${i + 1}</th>
      <td>${blogItem.title}</td>
      <td>${blogItem.authorName}</td>
      <td>${blogItem.content}</td>
    </tr> `;
                $('#tblBlogs').append(html);
            }


        }
        function editBlog(id) {
            let blogs = [];
            const existingBlogs = localStorage.getItem('blogs');
            if (existingBlogs != null) {
                blogs = JSON.parse(existingBlogs);
            }
            // const blog=blogs.find(x=>x.id===id);
            // if(blog){
            //      $('#blogId').val(blog.id);
            //     $('#blogTitle').val(blog.title);
            //     $('#blogAuthor').val(blog.authorName);
            //     $('#blogContent').val(blog.content);
            //     $('#btnsave').text('Update');
            // }
            const bloglist = blogs.filter(b => b.id === id);
            if (bloglist.length > 0) {
                const blog = bloglist[0];
                $('#blogTitle').val(blog.title);
                $('#blogAuthor').val(blog.authorName);
                $('#blogContent').val(blog.content);
                editingBlogId = id;
                
            }
        }
        function deleteBlog(id){
            let confirmDelete = confirm("Are you sure you want to delete this blog?");
            if(!confirmDelete){
                return;
            }
            let blogs = [];
            const existingBlogs = localStorage.getItem('blogs');
            if(existingBlogs!=null){
                blogs = JSON.parse(existingBlogs);
            }
            blogs = blogs.filter(b=>b.id !==id);
            localStorage.setItem('blogs',JSON.stringify(blogs));
            loadBlogs();
        }
    </script>
</body>

</html>
